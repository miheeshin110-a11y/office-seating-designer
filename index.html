:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  -webkit-font-smoothing: antialiased;
  font-size: var(--font-size-base);
  line-height: calc(var(--font-size-base) * 1.625);
  font-weight: var(--font-weight-normal);
}

.cursor-interaction {
  cursor: var(--cursor-interaction, pointer);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
  text-underline-offset: 2px;
  font-weight: inherit;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}
p,
h1,
h2,
h3,
h4,
h5,
h6,
li,
.table {
  font-family: var(--font-sans);
}

h1 {
  font-size: calc(var(--font-size-base) * 1.5);
  line-height: 1.3333333333;
}

h2 {
  font-size: calc(var(--font-size-base) * 1.25);
  line-height: 1.4;
}
h3 {
  font-size: calc(var(--font-size-base) * 1.125);
  line-height: 1.5555555556;
}
h4 {
  font-size: var(--font-size-base);
  line-height: 1.5;
}
h5,
h6 {
  font-size: var(--font-size-base);
  line-height: calc(var(--font-size-base) * 1.625);
}

h1,
h2,
h3,
h4,
h5,
h6,
b,
strong,
th {
  font-weight: 600;
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}
pre,
pre code {
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 20px;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  color: var(--foreground);
  font: inherit;
  text-align: start;
  border-collapse: separate;
  border-spacing: 0;
  font-size: calc(var(--font-size-base) * 0.875);
  line-height: calc(var(--font-size-base) * 1.625);
  font-family: var(--font-sans);
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
  border-bottom-color: color-mix(in srgb, var(--foreground) 5%, transparent);
}
.table :is(th, td):not(:last-child) {
  padding-inline-end: calc(var(--font-size-base) * 1.5);
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead :is(th, td) {
  border-bottom-color: var(--border-strong, var(--input));
  padding-block: calc(var(--font-size-base) / 2);
  line-height: var(--font-size-base);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}
.table tbody :is(th, td) {
  padding-block: calc(var(--font-size-base) * 0.625);
}

.table.table-sm :is(th, td) {
  padding-block: 8px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget > :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  border: 1px solid var(--border);
  corner-shape: var(--corner-shape);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
  font-family: var(--font-sans);
  padding: 5px 12px;
  border-color: color-mix(
    in oklab,
    light-dark(var(--primary-foreground), var(--foreground)) 5%,
    transparent
  );
  border-radius: var(--radius-2xl);
  color: light-dark(var(--primary-foreground), var(--foreground));
  background: light-dark(var(--foreground), var(--popover));
  box-shadow: 0 8px 18px rgb(15 23 42 / 20%);
  letter-spacing: -0.15px;
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: 600;
  line-height: 18px;
  text-align: center;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  color: color-mix(in srgb, var(--foreground) 40%, var(--muted-foreground));
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  font-family: var(--font-sans);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 1;
}

small,
.text-small {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

/* Match inline alignment without overriding a containing flex or grid layout. */
.btn,
.nav-link,
.form-control,
.form-select,
.form-range,
.form-check {
  vertical-align: middle;
}

.btn,
.nav-link {
  --btn-size: calc(12px + 2 * var(--control-spacing, 12px));
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  corner-shape: var(--corner-shape);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: inherit;
  font-family: var(--font-sans);
  height: fit-content;
  min-height: var(--btn-size);
  padding-inline: var(--control-spacing, 12px);
  border-color: transparent;
  border-radius: var(--radius-full);
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 18px;
}

.btn {
  border-color: var(--border);
  color: var(--secondary-foreground);
  background: var(--secondary);
}

/* Codex Button size="compact"; appearance stays with the button variant. */
.btn-sm {
  --btn-size: 24px;
  padding-inline: 8px;
  font-size: calc(var(--font-size-base) * 12 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 12 / 16), 1px);
  line-height: 16px;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: light-dark(
    color-mix(in srgb, var(--foreground) 5.5%, transparent),
    color-mix(in srgb, var(--foreground) 8%, transparent)
  );
}

.nav-link:not(:disabled):not([aria-disabled="true"]):hover {
  background: color-mix(in srgb, var(--foreground) 10%, transparent);
}

.btn-primary {
  border-color: var(--border);
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: border-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: border-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--muted-foreground);
  background: light-dark(
    color-mix(in srgb, var(--foreground) 5.5%, transparent),
    color-mix(in srgb, var(--foreground) 8%, transparent)
  );
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(> .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel > [data-variant][hidden] {
  display: none !important;
}

.viz-carousel > [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {
  --viz-carousel-hover: light-dark(
    color-mix(in srgb, var(--foreground) 5.4%, transparent),
    color-mix(in srgb, var(--foreground) 7.8%, transparent)
  );
  position: absolute;
  z-index: 2;
  bottom: 8px;
  left: 50%;
  display: flex;
  width: max-content;
  /* Leave room for the host's design-controls launcher at the trailing edge. */
  max-width: calc(100% - 96px);
  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  /* Match the settings dropdown chrome independently of the content font size. */
  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

/* Keep authored mockup button styles out of the shared carousel chrome. */
.viz-carousel-controls button,
.viz-carousel-picker > summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;
  color: inherit !important;
  background: transparent !important;
  font: inherit !important;
  -webkit-tap-highlight-color: transparent;
}

.viz-carousel-controls > button,
.viz-carousel-picker > summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls > button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker > summary {
  padding-inline: 12px !important;
}

.viz-carousel-controls .viz-carousel-caret {
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  color: inherit;

(() => {
function createOfficeRenderer(canvas){
  const gl=canvas.getContext('webgl',{alpha:true,antialias:true});
  if(!gl)return null;
  function shader(type,source){
    const shader=gl.createShader(type);
    gl.shaderSource(shader,source);
    gl.compileShader(shader);
    if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));
    return shader;
  }
  const program=gl.createProgram();
  gl.attachShader(program,shader(gl.VERTEX_SHADER,`
    attribute vec3 position;
    attribute vec3 color;
    uniform vec4 angle;
    uniform vec4 viewport;
    varying vec3 litColor;
    void main(){
      float depth=angle.y*position.x+angle.x*position.y;
      float x=angle.x*position.x-angle.y*position.y;
      float y=angle.z*depth-angle.w*position.z;
      float z=angle.w*depth+angle.z*position.z;
      gl_Position=vec4((x-viewport.x)*viewport.z,(viewport.y-y)*viewport.w,-z/1500.0,1.0);
      litColor=color;
    }`));
  gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`
    precision mediump float;
    varying vec3 litColor;
    void main(){gl_FragColor=vec4(litColor,1.0);}
  `));
  gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
  const buffer=gl.createBuffer();
  const position=gl.getAttribLocation(program,'position'), color=gl.getAttribLocation(program,'color');
  const angle=gl.getUniformLocation(program,'angle'), viewport=gl.getUniformLocation(program,'viewport');
  let solids=[], view=null;
  function render(parts,settings){
    solids=parts;
    view=settings;
    const {width,height,centerX,centerY,scale,cos,sin,rise,lift}=settings;
    const ratio=Math.min(2,window.devicePixelRatio||1);
    const pixelsWide=Math.round(width*ratio), pixelsHigh=Math.round(height*ratio);
    if(canvas.width!==pixelsWide||canvas.height!==pixelsHigh){
      canvas.width=pixelsWide;canvas.height=pixelsHigh;
    }
    const vertices=[];
    function triangle(a,b,c,rgb,shade){
      for(const point of [a,b,c]){
        const heightLight=.89+.11*Math.min(1,Math.max(0,point[2]/20));
        const lit=rgb.map(value=>value*shade*heightLight);
        vertices.push(...point,...lit);
      }
    }
    for(const {x,y,w,h,z,base,rgb,radius=0} of parts){
      const corners=[[x+radius,y+radius],[x+w-radius,y+radius],
        [x+w-radius,y+h-radius],[x+radius,y+h-radius]];
      const outline=corners.flatMap(([cx,cy],corner)=>{
        const segments=radius?5:1;
        return Array.from({length:segments},(_,step)=>{
          const theta=(Math.PI/2)*(corner+2+step/Math.max(1,segments-1));
          return [cx+radius*Math.cos(theta),cy+radius*Math.sin(theta)];
        });
      });
      const bevel=Math.min(radius*.36,(z-base)*.25);
      const ring=(height,inset)=>outline.map(([px,py])=>[
        x+w/2+(px-x-w/2)*(1-2*inset/w),
        y+h/2+(py-y-h/2)*(1-2*inset/h),height]);
      const rings=[ring(base,bevel),ring(base+bevel,0),ring(z-bevel,0),ring(z,bevel)];
      for(let i=0;i<outline.length;i++){
        const j=(i+1)%outline.length;
        const dx=outline[j][0]-outline[i][0],dy=outline[j][1]-outline[i][1];
        const length=Math.hypot(dx,dy)||1;
        const side=.73+.21*Math.max(0,(-dy*.48+dx*.88)/length);
        triangle([x+w/2,y+h/2,z],rings[3][i],rings[3][j],rgb,1);
        for(let k=0;k<3;k++){
          const shade=k===2?(side+1)/2:side;
          triangle(rings[k][i],rings[k][j],rings[k+1][j],rgb,shade);
          triangle(rings[k][i],rings[k+1][j],rings[k+1][i],rgb,shade);
        }
      }
    }
    gl.viewport(0,0,pixelsWide,pixelsHigh);
    gl.enable(gl.DEPTH_TEST);
    gl.clearColor(0,0,0,0);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.useProgram(program);
    gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(position);
    gl.enableVertexAttribArray(color);
    gl.vertexAttribPointer(position,3,gl.FLOAT,false,24,0);
    gl.vertexAttribPointer(color,3,gl.FLOAT,false,24,12);
    gl.uniform4f(angle,cos,sin,rise,lift);
    gl.uniform4f(viewport,centerX,centerY,2*scale/width,2*scale/height);
    gl.drawArrays(gl.TRIANGLES,0,vertices.length/6);
  }
  function pick(pixelX,pixelY){
    if(!view)return null;
    const {width,height,centerX,centerY,scale,cos,sin,rise,lift}=view;
    const across=centerX+(pixelX-width/2)/scale;
    const down=centerY+(pixelY-height/2)/scale;
    const origin=[cos*across+sin*rise*down,-sin*across+cos*rise*down,-lift*down];
    const direction=[sin*lift,cos*lift,rise];
    let nearest=-Infinity, id=null;
    for(const box of solids){
      const min=[box.x,box.y,box.base], max=[box.x+box.w,box.y+box.h,box.z];
      let low=-Infinity, high=Infinity;
      for(let axis=0;axis<3;axis++){
        const start=origin[axis], step=direction[axis];
        if(Math.abs(step)<1e-8){
          if(start<min[axis]||start>max[axis]){low=Infinity;break;}
          continue;
        }
        const a=(min[axis]-start)/step, b=(max[axis]-start)/step;
        low=Math.max(low,Math.min(a,b)); high=Math.min(high,Math.max(a,b));
      }
      if(low<=high&&high>nearest){nearest=high;id=box.id;}
    }
    return id;
  }
  return {render,pick};
}

    pendingMove=null;
    choose(plans[floor].seats[0].id);
    showPlacement(picked?picked.person+'님을 배치할 좌석을 선택하세요.':'');
  }
  if(control.hasAttribute('data-view')){flat=!flat;update();}
  if(control.dataset.turn){yaw+=Number(control.dataset.turn)*Math.PI/6;draw();}
  if(control.dataset.customPerson!==undefined&&activePlan===2){
    picked=rounds[0].roster[Number(control.dataset.customPerson)];
    renderFloorRoster();
    showPlacement(picked.person+'님을 배치할 좌석을 선택하세요.');
  }
  if(control.dataset.seat)selectSeat(control.dataset.seat);
});
q('[data-seat-picker]').addEventListener('change',event=>selectSeat(event.target.value));
const status=q('[data-round-status]');
for(const button of r.querySelectorAll('[data-plan]'))button.addEventListener('click',()=>{
  const next=Number(button.dataset.plan);
  if(next===activePlan)return;
  
  const currentFloor=floor;
  activePlan=next;
  restore({privateContent:structuredClone(rounds[next])});
  floor=currentFloor;
  if(!plans[floor].seats.some(seat=>seat.id===selected))selected=plans[floor].seats[0].id;
  picked=null;pendingMove=null;showPlacement('');
  status.textContent='';
  update();
});
function putMember(member,id){
  const occupant=records[id], previous=assignedSeats(member);
  const swap=occupant?.person&&memberKey(occupant)!==memberKey(member);
  if(swap&&previous.length!==1){
    showPlacement('미배치 인원은 빈 좌석에 놓아 주세요.');
    return;
  }
  for(const seat of previous)delete records[seat.id];
  if(swap)records[previous[0].id]=occupant;
  records[id]={team:member.team,person:member.person};
  picked=null;
  choose(id);
  saveCustom(swap?member.person+'님과 '+occupant.person+'님의 자리를 바꿨어요.':member.person+'님 · '+seatLabel(id)+' 배치');
}
function saveCustom(message){
  rounds[2]=snapshot();
  let stored=true;
  try{localStorage.setItem(customKey,JSON.stringify(rounds[2]));}catch{stored=false;}
  showPlacement(message+(stored?'':' · 공유용 HTML에 저장할 수 있어요.'));
}
function selectSeat(id){
  if(activePlan===2&&picked)putMember(picked,id);
  else choose(id);
}
let dragged=null;
let dropSeat=null;
function targetSeat(event){
  const pin=event.target.closest('[data-seat]');
  if(pin)return pin.dataset.seat;
  if(event.target===canvas&&renderer&&!flat){
    const rect=canvas.getBoundingClientRect();
    return renderer.pick(event.clientX-rect.left,event.clientY-rect.top);
  }
  return null;
}
function highlightTarget(id){
  if(id===dropSeat)return;
  dropSeat=id;
  for(const pin of pins.querySelectorAll('[data-seat]'))pin.classList.toggle('drop-target',pin.dataset.seat===id);
}
r.addEventListener('dragstart',event=>{
  const source=event.target.closest('[data-custom-person],[data-seat][draggable=true]');
  if(activePlan!==2||!source)return;
  dragged=source.dataset.seat?records[source.dataset.seat]:rounds[0].roster[Number(source.dataset.customPerson)];
  if(!dragged?.person){event.preventDefault();return;}
  event.dataTransfer.setData('text/plain',dragged.person);
  event.dataTransfer.effectAllowed='move';
});
stage.addEventListener('dragover',event=>{
  if(activePlan!==2||!dragged)return;
  const id=targetSeat(event);
  highlightTarget(id);
  if(id)event.preventDefault();
});
stage.addEventListener('dragleave',event=>{if(!stage.contains(event.relatedTarget))highlightTarget(null);});
stage.addEventListener('drop',event=>{
  if(activePlan!==2||!dragged)return;
  event.preventDefault();
  const id=targetSeat(event), member=dragged;
  dragged=null;
  highlightTarget(null);
  if(id)putMember(member,id);
});
const returnArea=q('.report-roster');
returnArea.addEventListener('dragover',event=>{
  if(activePlan===2&&dragged&&assignedSeats(dragged).length)event.preventDefault();
});
returnArea.addEventListener('drop',event=>{
  if(activePlan!==2||!dragged)return;
  const previous=assignedSeats(dragged);
  if(!previous.length)return;
  event.preventDefault();
  const member=dragged;
  dragged=null;picked=null;
  highlightTarget(null);
  for(const seat of previous)delete records[seat.id];
  update();
  saveCustom(member.person+'님을 미배치로 돌렸어요.');
});
r.addEventListener('dragend',()=>{dragged=null;highlightTarget(null);});
q('[data-share]').addEventListener('click',()=>{
  const data={fileId:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),draft:snapshot(),activePlan,rounds};
  const shareDocument=new DOMParser().parseFromString(documentSource,'text/html');
  shareDocument.getElementById('office-seed').textContent=JSON.stringify(data).replaceAll('<','\\u003c');
  const blob=new Blob(['<!doctype html>\n'+shareDocument.documentElement.outerHTML],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob), link=document.createElement('a');
  link.href=url;link.download='office-seating-report.html';link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  status.textContent='세 가지 배치안이 담긴 보고용 HTML을 내려받았어요.';
});
new ResizeObserver(()=>draw()).observe(stageScroll);
update();
})();

});
</script></body></html>
